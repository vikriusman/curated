# Loki in single-binary mode on node-local disk: enough to aggregate the lab's
# logs for 24h and answer LogQL queries from Argo's analysis steps.
# Everything the chart adds for scale (caches, gateway, canary, read/write split) is off.
deploymentMode: SingleBinary
loki:
  auth_enabled: false            # single tenant lab
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: {prefix: loki_index_, period: 24h}
  limits_config:
    retention_period: 24h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
    storageClass: local-path
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {memory: 512Mi}
read: {replicas: 0}
write: {replicas: 0}
backend: {replicas: 0}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
lokiCanary: {enabled: false}
gateway: {enabled: false}
test: {enabled: false}
minio: {enabled: false}
sidecar:
  rules: {enabled: false}
