# GENERATED by scripts/gen-loki-analysis.py; edit the query there, not here.
#
# Shared definition of "the canary is healthy", owned by the platform and used by
# any Rollout in any namespace (ClusterAnalysisTemplate). Rollouts only pass
# parameters; the LogQL query lives here, written once.
#
# Argo Rollouts has no Loki provider, so it asks Loki directly through the
# generic `web` provider: Loki evaluates LogQL over the app's JSON request logs
# (12-factor XI) and returns a number. No Prometheus, no recording rules.
#
# LogQL (args shown as <...>):
#   (sum(count_over_time({namespace="<namespace>", app="<app>", rollouts_pod_template_hash="<canary-hash>"} | json | msg="request" | code >= 500 [1m])) or vector(0)) / sum(count_over_time({namespace="<namespace>", app="<app>", rollouts_pod_template_hash="<canary-hash>"} | json | msg="request" [1m]))
apiVersion: argoproj.io/v1alpha1
kind: ClusterAnalysisTemplate
metadata:
  name: loki-error-rate
spec:
  args:
    - name: namespace
    - name: app
    - name: canary-hash
  metrics:
    - name: error-rate
      initialDelay: 20s          # let Alloy ship the first canary request logs
      interval: 15s
      count: 4                   # 4 measurements: the step finishes in ~1 minute
      failureLimit: 1            # one bad sample is tolerated, the second aborts
      consecutiveErrorLimit: 2   # Loki unreachable or no canary logs: fail closed
      successCondition: asFloat(result) <= 0.02
      provider:
        web:
          url: "http://loki.logging.svc:3100/loki/api/v1/query?query=%28sum%28count_over_time%28%7Bnamespace%3D%22{{args.namespace}}%22%2C%20app%3D%22{{args.app}}%22%2C%20rollouts_pod_template_hash%3D%22{{args.canary-hash}}%22%7D%20%7C%20json%20%7C%20msg%3D%22request%22%20%7C%20code%20%3E%3D%20500%20%5B1m%5D%29%29%20or%20vector%280%29%29%20%2F%20sum%28count_over_time%28%7Bnamespace%3D%22{{args.namespace}}%22%2C%20app%3D%22{{args.app}}%22%2C%20rollouts_pod_template_hash%3D%22{{args.canary-hash}}%22%7D%20%7C%20json%20%7C%20msg%3D%22request%22%20%5B1m%5D%29%29"
          jsonPath: "{$.data.result[0].value[1]}"
