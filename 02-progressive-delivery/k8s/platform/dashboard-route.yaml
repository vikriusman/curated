# Publishes the Argo Rollouts dashboard through the same Envoy Gateway listener
# as the app (:8080), under /rollouts.
#
# WARNING: the dashboard has no authentication, and from it anyone can promote,
# abort, retry or restart rollouts. Here the only protection is the EC2 security
# group, which allows port 8080 from the operator's own IP (/32) only. Do not
# widen that rule while this route exists; prefer `kubectl port-forward` on any
# shared or public setup.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argo-rollouts-dashboard
  namespace: argo-rollouts
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: http
  rules:
    - matches:
        - path: {type: PathPrefix, value: /rollouts}
      backendRefs:
        - {name: argo-rollouts-dashboard, port: 3100}
