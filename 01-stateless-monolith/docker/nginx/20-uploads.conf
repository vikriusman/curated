# Uploaded files are served by nginx straight from the FUSE (S3) mount,
# outside the document root and never passed to PHP.
# '^~' ensures the '\.php$' regex location never wins for this prefix.
location ^~ /uploads/ {
    alias /data/uploads/;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
}
