# 1 server + 2 agents: app pods spread across nodes, so "sessions and files
# are not tied to a node" is actually exercised.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: stateless-gallery
servers: 1
agents: 2
image: rancher/k3s:v1.35.5-k3s1
ports:
  - port: 8080:80
    nodeFilters: [loadbalancer]
options:
  k3s:
    extraArgs:
      - arg: --disable=metrics-server
        nodeFilters: [server:*]
