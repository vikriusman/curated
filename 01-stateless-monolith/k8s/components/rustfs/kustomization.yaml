apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - rustfs.yaml

# Point Mountpoint at RustFS instead of Amazon S3.
patches:
  - target: {kind: PersistentVolume, name: gallery-uploads}
    patch: |-
      - op: replace
        path: /spec/mountOptions
        value:
          - allow-delete
          - uid=1000
          - gid=1000
          - allow-other
          - region=us-east-1
          - force-path-style
          - endpoint-url=http://rustfs.storage.svc.cluster.local:9000
