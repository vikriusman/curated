# AWS overlay (k3s on EC2). Same RustFS component as local, but every secret is
# random and generated by `make aws-deploy` into *.env files that are never committed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
components:
  - ../../components/rustfs

configMapGenerator:
  - name: gallery-config
    namespace: gallery
    envs: [aws.env]

secretGenerator:
  - name: gallery-secret
    namespace: gallery
    envs: [secret.env]
  - name: rustfs
    namespace: storage
    envs: [rustfs.env]
  - name: aws-secret
    namespace: kube-system
    options:
      disableNameSuffixHash: true
    envs: [csi.env]
